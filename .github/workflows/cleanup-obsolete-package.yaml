name: cleanup-obsolete-package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the incorrectly named qemu package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE /user/packages/container/qemu
