name: image

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify
        run: |
          docker build --platform linux/amd64 -f Containerfile \
            -t ghcr.io/eddiexyang/libvirt:${{ github.sha }} .
          docker run --rm --platform linux/amd64 \
            --entrypoint /usr/libexec/qemu-kvm \
            ghcr.io/eddiexyang/libvirt:${{ github.sha }} \
            -device help | grep 'name "isa-applesmc"'
      - name: Publish
        run: |
          docker tag ghcr.io/eddiexyang/libvirt:${{ github.sha }} \
            ghcr.io/eddiexyang/libvirt:v1.9.0-qemu-9.2.4
          docker push ghcr.io/eddiexyang/libvirt:${{ github.sha }}
          docker push ghcr.io/eddiexyang/libvirt:v1.9.0-qemu-9.2.4
